<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>timeFont</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ================================================
   iFont — Kikiwake と同じ「和紙 × 墨」の骨格で、差し色を藍に
   ================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root{
  --washi:      #f5f0e4;
  --washi-dark: #e2dbc8;
  --cream:      #fdfbf5;
  --ink:        #1a140e;
  --ink-mid:    #3a3028;
  --ink-soft:   #5c5044;
  --indigo:     #1e3560;
  --indigo-l:   #2c4a80;
  --indigo-pale:#e6e9f0;
  --vermilion:  #be3a1e;

  --display: 'Zen Old Mincho', 'YuMincho', '游明朝', serif;
  --body:    'Noto Sans JP', 'Hiragino Sans', sans-serif;
}

body{
  font-family: var(--body); font-weight: 300; font-size: 15px; line-height: 2;
  color: var(--ink-mid); background: var(--washi);
  background-image: repeating-linear-gradient(180deg,
    transparent, transparent 3px, rgba(26,20,14,.007) 3px, rgba(26,20,14,.007) 4px);
  min-height: 100vh;
}
.wrap{ max-width: 860px; margin: 0 auto; padding: 38px 30px 46px; }

header{ margin-bottom: 30px; }
.eyebrow{
  font-size: .78em; letter-spacing: .2em; color: var(--indigo);
  display: flex; align-items: center; gap: 14px; margin-bottom: 10px;
}
.eyebrow::before{ content:''; display:block; width: 26px; height:1px; background: var(--indigo); }
h1{
  font-family: var(--display); font-weight: 700; font-size: 3.1em;
  letter-spacing: .16em; color: var(--ink); line-height: 1.1;
}
header p{ font-size: .86em; color: var(--ink-soft); letter-spacing: .04em; margin-top: 8px; }

.cols{ display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: start; }
.card{ background: var(--cream); border: 1px solid var(--washi-dark); padding: 22px 24px 26px; }
.card > h2{
  font-family: var(--display); font-size: 1.0em; font-weight: 700;
  letter-spacing: .18em; color: var(--ink); margin-bottom: 20px;
  padding-bottom: 10px; border-bottom: 1px solid var(--washi-dark);
}

.tabs{ display: flex; margin-bottom: 22px; border: 1px solid var(--washi-dark); }
.tab{
  flex: 1; padding: 9px 10px; text-align: center; cursor: pointer;
  font-size: .8em; letter-spacing: .08em; color: var(--ink-soft); background: transparent;
  border-right: 1px solid var(--washi-dark);
}
.tab:last-child{ border-right: 0 }
.tab[aria-selected="true"]{ background: var(--indigo); color: #fff; font-weight: 400 }

label{ display:block; font-size: .74em; letter-spacing: .12em; color: var(--ink-soft); margin: 20px 0 6px }
label:first-of-type{ margin-top: 0 }
input[type=text], input[type=number]{
  width: 100%; padding: 9px 11px; border: 1px solid var(--washi-dark); border-radius: 1px;
  font: inherit; font-size: 15px; font-weight: 400; background: #fff; color: var(--ink);
}
input::placeholder{ color: #b3aa9c; font-weight: 300 }
input:focus{ outline: none; border-color: var(--indigo) }

.choice{ display: flex; flex-wrap: wrap; gap: 6px }
.choice label{
  margin: 0; padding: 6px 11px; border: 1px solid var(--washi-dark); border-radius: 1px;
  cursor: pointer; font-size: .82em; letter-spacing: .06em; color: var(--ink-mid); background: #fff;
}
.choice input{ position: absolute; opacity: 0; pointer-events: none }
.choice label:has(input:checked){ border-color: var(--indigo); background: var(--indigo-pale); color: var(--indigo) }

button{
  margin-top: 26px; width: 100%; padding: 12px; border: 0; border-radius: 1px;
  background: var(--indigo); color: #fff; font: inherit; font-size: .95em; font-weight: 500;
  letter-spacing: .3em; cursor: pointer; transition: background .2s;
}
button:hover{ background: var(--indigo-l) }
button:disabled{ opacity: .5; cursor: default }

.hint{ font-size: .72em; line-height: 1.9; color: var(--ink-soft); margin-top: 7px }
#out img{ width: 100%; border: 1px solid var(--washi-dark); background: #fff; display: block }
#out video{ width: 100%; border: 1px solid var(--washi-dark); background: var(--ink) }
#out .cap{ font-size: .72em; letter-spacing: .12em; color: var(--ink-soft); margin: 14px 0 6px }
#out .cap:first-child{ margin-top: 0 }
#cmd{
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .7em; line-height: 1.8;
  color: var(--ink-soft); background: var(--washi); border-left: 2px solid var(--indigo);
  padding: 9px 12px; margin-top: 18px; word-break: break-all;
}
#err{ color: var(--vermilion); font-size: .8em; margin-top: 14px; display: none }
.empty{ color: #b3aa9c; font-size: .8em; letter-spacing: .1em; text-align: center; padding: 56px 0 }
.hidden{ display: none }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">時間情報付きフォントの生成</div>
    <h1>timeFont</h1>
    <p>音声から文字が分かっていく過程に合わせて変化する動的フォントをつくる</p>
  </header>

  <div class="cols">
    <div class="card">
      <h2>入力</h2>
      <div class="tabs" role="tablist">
        <div class="tab" role="tab" aria-selected="true" data-mode="text">① 文字列</div>
        <div class="tab" role="tab" aria-selected="false" data-mode="ext">② 音声と時間変化</div>
      </div>

      <div id="pane-text">
        <label for="text">文字列</label>
        <input type="text" id="text" value="まさかここであうとは">

        <label>対象</label>
        <div class="choice">
          <label><input type="radio" name="scope" value="all" checked><span>全文字</span></label>
          <label><input type="radio" name="scope" value="first"><span>先頭の 1 文字だけ</span></label>
        </div>
      </div>

      <div id="pane-ext" class="hidden">
        <label for="text2">文字列</label>
        <input type="text" id="text2" value="ちはやふる">
        <label for="audio">音声ファイル（wav）</label>
        <input type="text" id="audio" placeholder="/path/to/yomi.wav">
        <label for="onsets">各文字の開始時刻（ms、カンマ区切り）</label>
        <input type="text" id="onsets" placeholder="0,320,640,960,1280">
        <label for="curve">時間変化のファイル（time_ms,value）</label>
        <input type="text" id="curve" placeholder="/path/to/curve.csv">
        <label for="kimariji">動かす文字</label>
        <input type="text" id="kimariji" placeholder="ちは">
      </div>

      <label>表示方式</label>
      <div class="choice">
        <label><input type="radio" name="family" value="fade"><span>フェード</span></label>
        <label><input type="radio" name="family" value="reveal"><span>部分表示</span></label>
        <label><input type="radio" name="family" value="blur" checked><span>ぼかし解除</span></label>
        <label><input type="radio" name="family" value="wipe"><span>ワイプ</span></label>
      </div>

      <label for="slot">1 文字の持ち時間（ms）</label>
      <input type="number" id="slot" value="350" min="0" step="50">

      <button id="go">生成</button>
      <div id="err"></div>
    </div>

    <div class="card">
      <h2>出力</h2>
      <div id="out"><div class="empty">生成すると、ここで再生できます</div></div>
      <div id="cmd" class="hidden"></div>
    </div>
  </div>
</div>

<script>
let mode = "text";
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  mode = t.dataset.mode;
  document.querySelectorAll(".tab").forEach(o => o.setAttribute("aria-selected", o === t));
  document.getElementById("pane-text").classList.toggle("hidden", mode !== "text");
  document.getElementById("pane-ext").classList.toggle("hidden", mode === "text");
}));

const $ = id => document.getElementById(id);
const val = name => document.querySelector(`input[name=${name}]:checked`).value;

$("go").addEventListener("click", async () => {
  const body = new URLSearchParams({
    mode,
    text: mode === "text" ? $("text").value : $("text2").value,
    family: val("family"),
    slot_ms: $("slot").value,
    scope: val("scope"),
    audio: $("audio").value, onsets: $("onsets").value,
    curve: $("curve").value, kimariji: $("kimariji").value,
  });
  $("err").style.display = "none";
  $("go").disabled = true; $("go").textContent = "生成中…";
  try {
    const r = await fetch("/generate", {method: "POST", body});
    const d = await r.json();
    if (d.error) {
      $("err").textContent = d.error; $("err").style.display = "block";
    } else {
      $("out").innerHTML =
        `<div class="cap">生成した動画のコマ</div>
         <img src="${d.poster}" alt="生成した動画のコマ">
         <div class="cap">再生（音つき）</div>
         <video controls playsinline src="${d.video}"></video>`;
      $("cmd").textContent = d.command; $("cmd").classList.remove("hidden");
    }
  } catch (e) {
    $("err").textContent = String(e); $("err").style.display = "block";
  }
  $("go").disabled = false; $("go").textContent = "生成";
});

// ?auto=1 で読み込み後にそのまま生成する（画面を撮るときに使う）
if (new URLSearchParams(location.search).get("auto")) {
  window.addEventListener("load", () => $("go").click());
}
</script>
</body>
</html>
