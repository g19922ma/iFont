<!--
  較正の追加バッチの入口（2026-08-27）。**実験としては較正1回目の続き**。

  ■ 1回目と同じところ
  字（8字）・課題の形・1人あたりの構成（本命24問＋紛れ36問＋確認問題）・
  うすい→濃い／点が増える の水準と速さ2水準。

  ■ 変えたところ（すべて1回目の結果にもとづく水準調整＋方式1つの追加）
    ・ぼやけ   … 薄い側へ（3〜48%。1回目は26%より薄い側が未測定で、床が決められなかった）
    ・端から   … 25〜100%の空白を埋める並びへ（「ぱ」の中点99.5%が外挿だった）
    ・うすい×ぼやけ … 新規。組み合わせの識別曲線を直接測る。
      進み具合の写し方は transfer_config.js の composite_axis に固定してある
      （字によらない指数。刺激の定義の一部）。速さは1本。

  ■ 1回目・他のどの実験に出た人も断る（phase_blocks.calib2）。
    掲載側でも回答不可リスト（会員ID 253名）を入れること。

  ?v= はJS側の VERSION と揃える(キャッシュ対策)。
-->
