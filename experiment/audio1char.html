<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 倫理審査の承認・本番デプロイ前は検索インデックスを禁止 (他ページと同様)。 -->
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かなの聞き取り課題（1文字）</title>
<style>
  :root { color-scheme: light; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif; margin: 0;
         background:#f6f4ef; color:#1b2030; }
  #app { max-width: 720px; margin: 0 auto; padding: 24px 20px; }
  .card { background:#fff; border:1px solid #e6e1d6; border-radius:14px; padding:22px;
          box-shadow: 0 1px 0 rgba(0,0,0,.03), 0 10px 28px rgba(46,125,143,.08); }
  h1, h2 { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; letter-spacing:.04em; color:#1E2A5E; }
  h1 { font-size: 19px; border-bottom:1px solid #e9e4d8; padding-bottom:10px; }
  h2 { font-size: 18px; }
  button.primary { font-size:16px; padding:11px 26px; border-radius:999px; border:0;
                   background:#2E7D8F; color:#fff; cursor:pointer; letter-spacing:.02em;
                   transition: filter .15s; }
  button.primary:hover { filter: brightness(1.1); }
  #stage { margin-top: 8px; }
  .kana { font-family: system-ui, sans-serif; font-size:19px; padding:10px 0; border:1px solid #cdd3e6; border-radius:8px; background:#fbfcff; cursor:pointer; }
  .kana:hover { background:#eefaff; } .kana:active{ background:#d8f0f6; }
  .kana:disabled { opacity:.45; cursor:default; }
  .spacer { visibility:hidden; }
  .muted { color:#6b7280; font-size:13px; }
  .ask { font-weight:700; color:#2E7D8F; }
  .playbtn { font-size:16px; padding:11px 22px; border-radius:999px; border:1px solid #c9a9a0;
             background:#fff; cursor:pointer; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  td,th { border:1px solid #e3e6ee; padding:6px 8px; text-align:center; }
</style>
</head>
<body>
<div id="app"><div class="card" id="screen"></div></div>
<!-- ?v= はJS側の VERSION と揃える(キャッシュ対策)。本番化の共通配管は課題スクリプトより先に読む。 -->
<script src="prod_common.js?v=2.1"></script>
<script src="audio1char.js?v=2.1"></script>
</body>
</html>
