<!doctype html><html lang="ja"><head><meta charset="utf-8">
<title>アニメーション方式別プレビュー＋正答率(pilot2)</title>
<style>
  :root{ --bg:#f7f5f0; --panel:#fff; --ink:#2a2620; --muted:#7a756a; --line:#e3ddd0; --accent:#b5502f; --grid:#eee7d8; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:28px 20px 60px}
  h1{font-size:19px;margin:0 0 4px;font-weight:600}
  .sub{color:var(--muted);font-size:13px;margin:0 0 26px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:18px;max-width:1180px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .card h2{font-size:15px;margin:0 0 2px;display:flex;align-items:baseline;gap:8px}
  .card h2 b{font-size:16px}
  .card .desc{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.5}
  .row{display:flex;gap:16px;align-items:flex-start}
  .stimwrap{flex:0 0 auto;text-align:center}
  canvas{width:150px;height:150px;background:#fff;border:1px solid var(--line);border-radius:6px;display:block}
  .pctlabel{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
  .charbtns{margin-top:8px;display:flex;gap:6px;justify-content:center}
  .charbtns button{font-size:13px;padding:2px 9px;border-radius:5px;border:1px solid var(--line);background:#faf8f3;cursor:pointer;color:var(--ink)}
  .charbtns button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chartarea{flex:1;min-width:0}
  svg{width:100%;height:150px;overflow:visible}
  .axislabel{font-size:10px;fill:var(--muted)}
  .n{font-size:9.5px;fill:var(--muted)}
  .curve{fill:none;stroke:var(--accent);stroke-width:2}
  .pt{fill:var(--accent)}
  .gridline{stroke:var(--grid);stroke-width:1}
  .controls{max-width:1180px;margin:0 auto 18px;font-size:12.5px;color:var(--muted)}
  .controls label{margin-right:14px}
</style></head><body>

<h1>アニメーション方式別 見え方 ＋ 正答率</h1>
<p class="sub">kurihara-pilot2（較正フェーズ・群A′・視覚、2026-08-24実測）のデータ。正答率は各方式のターゲット字（表示中の2字＋この方式に割り当たったその他の字を含む全ターゲット試行）を進み具合ごとに集計。n が小さい点（1人ぶんのパイロットのため）はブレを含む。</p>

const ACC = {"blur": [{"pct": 3.0, "n": 8, "acc": 87.5}, {"pct": 6.0, "n": 2, "acc": 100.0}, {"pct": 13.0, "n": 3, "acc": 100.0}, {"pct": 22.0, "n": 2, "acc": 100.0}, {"pct": 34.0, "n": 2, "acc": 100.0}, {"pct": 50.0, "n": 3, "acc": 100.0}, {"pct": 70.0, "n": 3, "acc": 100.0}, {"pct": 100.0, "n": 2, "acc": 100.0}], "fade": [{"pct": 3.0, "n": 6, "acc": 33.3}, {"pct": 6.0, "n": 6, "acc": 100.0}, {"pct": 13.0, "n": 7, "acc": 100.0}, {"pct": 22.0, "n": 5, "acc": 100.0}, {"pct": 34.0, "n": 7, "acc": 100.0}, {"pct": 50.0, "n": 5, "acc": 100.0}, {"pct": 70.0, "n": 7, "acc": 100.0}, {"pct": 100.0, "n": 5, "acc": 100.0}], "reveal": [{"pct": 3.0, "n": 5, "acc": 40.0}, {"pct": 6.0, "n": 3, "acc": 100.0}, {"pct": 13.0, "n": 3, "acc": 100.0}, {"pct": 22.0, "n": 4, "acc": 100.0}, {"pct": 34.0, "n": 3, "acc": 100.0}, {"pct": 50.0, "n": 3, "acc": 100.0}, {"pct": 70.0, "n": 4, "acc": 100.0}, {"pct": 100.0, "n": 4, "acc": 100.0}], "wipe": [{"pct": 3.0, "n": 5, "acc": 60.0}, {"pct": 6.0, "n": 3, "acc": 66.7}, {"pct": 13.0, "n": 3, "acc": 100.0}, {"pct": 22.0, "n": 2, "acc": 100.0}, {"pct": 34.0, "n": 4, "acc": 100.0}, {"pct": 50.0, "n": 4, "acc": 75.0}, {"pct": 70.0, "n": 4, "acc": 100.0}, {"pct": 100.0, "n": 3, "acc": 100.0}]};
const META = {"fade": {"label": "フェード", "desc": "不透明度を s（進み具合）でそのまま上げる", "chars": ["か", "つ"], "dir": null}, "reveal": {"label": "部分表示", "desc": "字ごとに固定したランダム順で、画素を1つずつ黒く塗り足す", "chars": ["が", "ま"], "dir": null}, "blur": {"label": "ぼかし解除", "desc": "ガウスぼかしの半径を s に応じて減らす（s=0で最大ぼかし、s=1で鮮明）", "chars": ["ぱ", "ら"], "dir": null}, "wipe": {"label": "ワイプ", "desc": "字のインクがある範囲だけを、左から右へ徐々に見せる", "chars": ["あ", "し"], "dir": "ltr"}};
const SIZE = 256;

// ---- 画像読み込み(data URIなのでcanvas読み出しもタイント無し) ----
const imgs = {};
function loadImg(ch){
  return new Promise((res)=>{
    const im = new Image();
    im.onload = ()=>{ imgs[ch]=im; res(); };
    im.src = "data:image/png;base64," + IMG_B64[ch];
  });
}

// ---- transfer.js の4方式描画ロジックを移植(挙動は完全に同じ) ----
function drawBlank(ctx){ ctx.fillStyle="#fff"; ctx.fillRect(0,0,SIZE,SIZE); }

function hashSeed(str){ let h=2166136261; for(let i=0;i<str.length;i++){h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function mulberry32(seed){ let a=seed>>>0; return function(){ a=(a+0x6D2B79F5)>>>0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
const revealOrder = {};
function revealPrepare(ch){
  if(revealOrder[ch]) return revealOrder[ch];
  const off=document.createElement("canvas"); off.width=SIZE; off.height=SIZE;
  const octx=off.getContext("2d",{willReadFrequently:true});
  octx.fillStyle="#fff"; octx.fillRect(0,0,SIZE,SIZE);
  if(imgs[ch]) octx.drawImage(imgs[ch],0,0,SIZE,SIZE);
  const px=octx.getImageData(0,0,SIZE,SIZE).data;
  const th=128, idx=[];
  for(let i=0;i<SIZE*SIZE;i++){
    const lum=0.299*px[i*4]+0.587*px[i*4+1]+0.114*px[i*4+2];
    if(lum<=th) idx.push(i);
  }
  const rnd=mulberry32(hashSeed("stroke-mask:"+ch));
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
  revealOrder[ch]=Uint32Array.from(idx);
  return revealOrder[ch];
}
const revealState = {};
function revealDraw(ctx, ch, s){
  revealPrepare(ch);
  if(!revealState[ch]){ revealState[ch]={shown:0, img:ctx.createImageData(SIZE,SIZE)}; revealState[ch].img.data.fill(255); }
  const st = revealState[ch];
  const order = revealOrder[ch];
  const want = Math.round(order.length*Math.max(0,Math.min(1,s)));
  const d = st.img.data;
  if(want < st.shown){ d.fill(255); st.shown=0; }
  for(let i=st.shown;i<want;i++){ const p=order[i]*4; d[p]=0; d[p+1]=0; d[p+2]=0; d[p+3]=255; }
  st.shown = want;
  ctx.putImageData(st.img,0,0);
}

const blurOffCache = {};
function blurDraw(ctx, ch, s){
  if(!blurOffCache[ch]){
    const off=document.createElement("canvas"); off.width=SIZE; off.height=SIZE;
    const octx=off.getContext("2d");
    octx.fillStyle="#fff"; octx.fillRect(0,0,SIZE,SIZE);
    if(imgs[ch]) octx.drawImage(imgs[ch],0,0,SIZE,SIZE);
    blurOffCache[ch]=off;
  }
  const maxR=24;
  const r = maxR*(1-Math.max(0,Math.min(1,s)));
  drawBlank(ctx);
  ctx.save();
  ctx.filter = r>0.01 ? `blur(${r.toFixed(2)}px)` : "none";
  ctx.drawImage(blurOffCache[ch],0,0,SIZE,SIZE);
  ctx.restore();
  ctx.filter="none";
}

const wipeBBox = {};
function wipeBBoxPrepare(ch){
  if(wipeBBox[ch]) return wipeBBox[ch];
  const off=document.createElement("canvas"); off.width=SIZE; off.height=SIZE;
  const octx=off.getContext("2d",{willReadFrequently:true});
  octx.fillStyle="#fff"; octx.fillRect(0,0,SIZE,SIZE);
  if(imgs[ch]) octx.drawImage(imgs[ch],0,0,SIZE,SIZE);
  const px=octx.getImageData(0,0,SIZE,SIZE).data;
  const th=128;
  let xMin=SIZE,xMax=0,yMin=SIZE,yMax=0,found=false;
  for(let y=0;y<SIZE;y++){ for(let x=0;x<SIZE;x++){
    const i=y*SIZE+x;
    const lum=0.299*px[i*4]+0.587*px[i*4+1]+0.114*px[i*4+2];
    if(lum<=th){ found=true; if(x<xMin)xMin=x; if(x+1>xMax)xMax=x+1; if(y<yMin)yMin=y; if(y+1>yMax)yMax=y+1; }
  }}
  const bbox = found ? {xMin,xMax,yMin,yMax} : {xMin:0,xMax:SIZE,yMin:0,yMax:SIZE};
  wipeBBox[ch]=bbox;
  return bbox;
}
function wipeDraw(ctx, ch, s){
  const p=Math.max(0,Math.min(1,s));
  drawBlank(ctx);
  if(!imgs[ch]) return;
  const b=wipeBBoxPrepare(ch);
  const w = b.xMin + (b.xMax-b.xMin)*p;
  const rw=w, rh=SIZE, rx=0, ry=0;
  if(rw<=0||rh<=0) return;
  ctx.save(); ctx.beginPath(); ctx.rect(rx,ry,rw,rh); ctx.clip();
  ctx.drawImage(imgs[ch],0,0,SIZE,SIZE);
  ctx.restore();
}

function fadeDraw(ctx, ch, s){
  drawBlank(ctx);
  if(!imgs[ch]) return;
  ctx.globalAlpha = Math.max(0,Math.min(1,s));
  ctx.drawImage(imgs[ch],0,0,SIZE,SIZE);
  ctx.globalAlpha=1;
}

const DRAW = { fade: fadeDraw, reveal: revealDraw, blur: blurDraw, wipe: wipeDraw };

// ---- 折れ線グラフ(SVG、簡易) ----
function buildChart(svg, points){
  const W=320,H=140,padL=30,padR=10,padT=10,padB=20;
  const xs = p => padL + (p.pct/100)*(W-padL-padR);
  const ys = a => padT + (1-a.acc/100)*(H-padT-padB);
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
  // gridlines
  [0,50,100].forEach(v=>{
    const y = padT + (1-v/100)*(H-padT-padB);
    s += `<line class="gridline" x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}"/>`;
    s += `<text class="axislabel" x="2" y="${y+3}">${v}</text>`;
  });
  s += `<line class="gridline" x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}"/>`;
  const path = points.map((p,i)=> (i===0?"M":"L") + xs(p).toFixed(1) + "," + ys(p).toFixed(1)).join(" ");
  s += `<path class="curve" d="${path}"/>`;
  points.forEach(p=>{
    s += `<circle class="pt" cx="${xs(p).toFixed(1)}" cy="${ys(p).toFixed(1)}" r="3"/>`;
    s += `<text class="n" x="${xs(p).toFixed(1)}" y="${H-4}" text-anchor="middle">${p.pct}%</text>`;
  });
  s += `</svg>`;
  svg.innerHTML = s;
}

// ---- 組み立て ----
const grid = document.getElementById("grid");
const families = ["fade","reveal","blur","wipe"];
const state = {}; // family -> {ch, canvas, ctx, pctEl}

Promise.all(Object.keys(IMG_B64).map(loadImg)).then(()=>{
  families.forEach(fam=>{
    const m = META[fam];
    const card = document.createElement("div");
    card.className = "card";
    const chBtns = m.chars.map((c,i)=>`<button data-fam="${fam}" data-ch="${c}" class="${i===0?'active':''}">${c}</button>`).join("");
    card.innerHTML = `
      <h2><b>${m.label}</b><span style="font-size:11px;color:var(--muted)">(${fam})</span></h2>
      <p class="desc">${m.desc}</p>
      <div class="row">
        <div class="stimwrap">
          <canvas id="cv-${fam}" width="${SIZE}" height="${SIZE}"></canvas>
          <div class="pctlabel" id="pct-${fam}">0%</div>
          <div class="charbtns">${chBtns}</div>
        </div>
        <div class="chartarea"><div id="chart-${fam}"></div></div>
      </div>`;
    grid.appendChild(card);
    const canvas = document.getElementById(`cv-${fam}`);
    state[fam] = { ch: m.chars[0], canvas, ctx: canvas.getContext("2d"), pctEl: document.getElementById(`pct-${fam}`) };
    buildChart(document.getElementById(`chart-${fam}`), ACC[fam]);
    card.querySelectorAll(".charbtns button").forEach(b=>{
      b.addEventListener("click", ()=>{
        card.querySelectorAll(".charbtns button").forEach(x=>x.classList.remove("active"));
        b.classList.add("active");
        state[fam].ch = b.dataset.ch;
      });
    });
  });

  // ---- アニメーションループ ----
  let t0 = performance.now();
  function frame(now){
    const playing = document.getElementById("playToggle").checked;
    const period = Number(document.getElementById("speed").value);
    if(playing){
      const el = (now - t0) % (period*1.4); // 1.4周ぶんで「満了→白紙に戻る間」を作る
      const s = Math.max(0, Math.min(1, el/period));
      families.forEach(fam=>{
        const st = state[fam];
        DRAW[fam](st.ctx, st.ch, s);
        st.pctEl.textContent = Math.round(s*100) + "%";
      });
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
});

document.getElementById("speed").addEventListener("input", (e)=>{
  document.getElementById("speedVal").textContent = e.target.value + "ms";
});
</script>
