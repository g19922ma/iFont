const CHARS = ["あ", "い", "う", "え", "お", "か", "き", "く", "け", "こ", "さ", "し", "す", "せ", "そ", "た", "ち", "つ", "て", "と", "な", "に", "ぬ", "ね", "の", "は", "ひ", "ふ", "へ", "ほ", "ま", "み", "む", "め", "も", "や", "ゆ", "よ", "ら", "り", "る", "れ", "ろ", "わ", "ん", "が", "ぎ", "ぐ", "げ", "ご", "ざ", "じ", "ず", "ぜ", "ぞ", "だ", "で", "ど", "ば", "び", "ぶ", "べ", "ぼ", "ぱ", "ぴ", "ぷ", "ぺ", "ぽ"];
const A = new Audio();
let queue = [], qi = 0, curBtn = null;
const bnow = document.getElementById("bnow");
function btnOf(c) { return document.querySelector('button.p[data-c="'+c+'"]'); }
function clearMark() { if (curBtn) curBtn.classList.remove("on"); curBtn = null; }
function stop() { A.pause(); A.onended = null; queue = []; qi = 0; clearMark(); bnow.textContent = "—"; }
function step() {
  clearMark();
  if (qi >= queue.length) { stop(); return; }
  const c = queue[qi++];
  const b64 = AUD[c];
  if (!b64) { step(); return; }
  bnow.textContent = c + "（" + qi + " / " + queue.length + "）";
  curBtn = btnOf(c); if (curBtn) curBtn.classList.add("on");
  A.src = "data:audio/mpeg;base64," + b64;
  A.onended = () => setTimeout(step, 250);
  A.play().catch(() => {});
}
function run(items) { stop(); queue = items; qi = 0; step(); }
document.getElementById("bstop").addEventListener("click", stop);
document.getElementById("playAll").addEventListener("click", () => run(CHARS.filter(c => AUD[c])));
document.addEventListener("click", (e) => {
  const one = e.target.closest("button.p");
  if (one) run([one.dataset.c]);
});
</script>
