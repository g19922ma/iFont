<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>母音か子音か — セグメント操作パイロット</title>
<style>
  :root{--paper:#f6f1e5; --ink:#262220; --ink2:#5a5348; --line:#c9bfa6;
        --ai:#234794; --shu:#c73e2e; --matsu:#3f6b4f;}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Hiragino Mincho ProN","Yu Mincho",serif; color:var(--ink);
    min-height:100vh; padding:30px 40px 50px;
    background:repeating-linear-gradient(0deg, transparent 0 2px, rgba(120,100,60,.022) 2px 3px), var(--paper);}
  header{display:flex; align-items:baseline; gap:16px; margin-bottom:4px;}
  h1{font-size:24px; letter-spacing:.12em; font-weight:600;}
  .stamp{font-size:11px; color:#fff; background:var(--shu); padding:4px 8px;
    border-radius:3px; transform:rotate(-2deg);
    font-family:"Hiragino Kaku Gothic ProN",sans-serif;}
  .sub{color:var(--ink2); font-size:13px; margin-bottom:20px; line-height:1.8;}
  button{font-family:inherit; font-size:15px; letter-spacing:.08em; cursor:pointer;
    padding:10px 20px; border-radius:5px; border:1px solid var(--ink2);
    background:#fffdf7; color:var(--ink); transition:all .15s;}
  button:hover{background:var(--ink); color:var(--paper);}
  button.primary{background:var(--shu); border-color:var(--shu); color:#fff;}
  button.primary:hover{background:#a93325;}
  button:disabled{opacity:.35; cursor:default;}
  #stagebox{background:#fffdf7; border:1px solid var(--line); border-radius:8px;
    padding:34px; margin-top:8px; box-shadow:0 3px 14px rgba(60,45,20,.08); min-height:300px;}
  .qtitle{font-size:15px; color:var(--ink2); letter-spacing:.08em; margin-bottom:16px;}
  .choices{display:flex; gap:14px; flex-wrap:wrap; margin:10px 0 6px;}
  .choices button{font-size:19px; padding:14px 22px;}
  .scale{display:flex; gap:10px; margin:10px 0;}
  .scale button{min-width:52px;}
  #progress{color:var(--ink2); font-size:13px; margin-top:14px; letter-spacing:.06em;}
  table{border-collapse:collapse; margin-top:14px; font-size:13.5px;}
  th,td{border:1px solid var(--line); padding:6px 12px; text-align:center;}
  th{background:#efe7d4; font-weight:600;}
  .note{color:var(--ink2); font-size:12.5px; margin-top:14px; line-height:1.8;}
</style>
</head>
<body>
<header><h1>母音か子音か</h1><span class="stamp">セグメント操作パイロット</span></header>
<div class="sub">
  百人一首の読みの一部を聞いて、<b>どの歌かを当てる</b>。音声は母音だけ／子音だけの長さを
  変えてある。どの部分の時間が「聞き分けの進み」を支えているかを調べる。
</div>
<div id="stagebox">
  <div id="intro">
    <div class="qtitle">「ち」で始まる歌は3首。読みの冒頭が流れるので、どの歌かを答えてください。
    途中で切れるものも多いです。当てずっぽうでもOK（そのあと確信度を聞きます）。</div>
    <button class="primary" id="start">はじめる（30問・約5分）</button>
  </div>
  <div id="trial" style="display:none">
    <div class="qtitle" id="qnum"></div>
    <button class="primary" id="play">▶ 音を聞く</button>
    <div id="answerbox" style="display:none">
      <div class="qtitle" style="margin-top:20px">どの歌？</div>
      <div class="choices" id="choices"></div>
      <div class="qtitle" style="margin-top:18px">確信度（1=当てずっぽう 〜 5=確実）</div>
      <div class="scale" id="conf"></div>
      <div id="natbox" style="display:none">
        <div class="qtitle" style="margin-top:18px">読み方の自然さ（1=とても変 〜 5=自然）</div>
        <div class="scale" id="nat"></div>
      </div>
      <button class="primary" id="next" style="margin-top:18px" disabled>次へ</button>
    </div>
  </div>
  <div id="result" style="display:none"></div>
</div>
<div class="note">刺激: 木本読み「ちは 上の句」／音素境界はMFA実測／PSOLAで母音・子音の長さを個別に伸縮。
データはブラウザ内のみ（CSVで書き出し）。</div>

<script>
let M = null, ctx = null, buffers = {};
let plan = [], ti = -1, rec = [], cur = {};

async function init() {
  M = await (await fetch("manifest.json")).json();
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  for (const v of M.variants) {
    const ab = await (await fetch(v.file)).arrayBuffer();
    buffers[v.id] = await ctx.decodeAudioData(ab);
  }
  // 試行計画: 全変形 × 全ゲート、シャッフル
  M.variants.forEach((v, vi) => v.gates_s.forEach((g, gi) =>
    plan.push({vi, gi})));
  for (let i = plan.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [plan[i], plan[j]] = [plan[j], plan[i]];
  }
}
const iP = init();

function mkScale(el, cb) {
  el.innerHTML = "";
  for (let s = 1; s <= 5; s++) {
    const b = document.createElement("button");
    b.textContent = s;
    b.onclick = () => { [...el.children].forEach(c => c.style.background = "");
      b.style.background = "#e6dcc0"; cb(s); };
    el.appendChild(b);
  }
}

document.getElementById("start").onclick = async () => {
  await iP;
  document.getElementById("intro").style.display = "none";
  document.getElementById("trial").style.display = "block";
  nextTrial();
};

function nextTrial() {
  ti++;
  if (ti >= plan.length) return finish();
  cur = { ...plan[ti], choice: null, conf: null, nat: null, t_play: null };
  const isFull = M.variants[cur.vi].gates_s[cur.gi] === null;
  document.getElementById("qnum").textContent = `第${ti + 1}問 / ${plan.length}`;
  document.getElementById("answerbox").style.display = "none";
  document.getElementById("natbox").style.display = isFull ? "block" : "none";
  document.getElementById("play").disabled = false;
  const ch = document.getElementById("choices");
  ch.innerHTML = "";
  M.choices.forEach((c, i) => {
    const b = document.createElement("button");
    b.textContent = c;
    b.onclick = () => { cur.choice = i;
      [...ch.children].forEach(x => x.style.background = "");
      b.style.background = "#e6dcc0"; checkReady(); };
    ch.appendChild(b);
  });
  const b = document.createElement("button");
  b.textContent = "わからない";
  b.onclick = () => { cur.choice = -1;
    [...ch.children].forEach(x => x.style.background = "");
    b.style.background = "#e6dcc0"; checkReady(); };
  ch.appendChild(b);
  mkScale(document.getElementById("conf"), s => { cur.conf = s; checkReady(); });
  mkScale(document.getElementById("nat"), s => { cur.nat = s; checkReady(); });
  document.getElementById("next").disabled = true;
}

function checkReady() {
  const isFull = M.variants[cur.vi].gates_s[cur.gi] === null;
  const ok = cur.choice !== null && cur.conf !== null && (!isFull || cur.nat !== null);
  document.getElementById("next").disabled = !ok;
}

document.getElementById("play").onclick = () => {
  const v = M.variants[cur.vi];
  const gate = v.gates_s[cur.gi];
  const buf = buffers[v.id];
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const g = ctx.createGain();
  src.connect(g); g.connect(ctx.destination);
  const t0 = ctx.currentTime + 0.05;
  const dur = gate === null ? buf.duration : Math.min(gate, buf.duration);
  g.gain.setValueAtTime(1, t0);
  g.gain.setValueAtTime(1, t0 + Math.max(0, dur - 0.008));
  g.gain.linearRampToValueAtTime(0, t0 + dur);
  src.start(t0, 0, dur + 0.01);
  cur.t_play = Date.now();
  document.getElementById("play").disabled = true;   // 1回だけ聞ける
  document.getElementById("answerbox").style.display = "block";
}

document.getElementById("next").onclick = () => {
  const v = M.variants[cur.vi];
  rec.push({trial: ti + 1, variant: v.id, target: v.target, scale: v.scale,
            gate_idx: cur.gi, gate_label: M.gate_labels[cur.gi],
            choice: cur.choice, correct: cur.choice === M.answer ? 1 : 0,
            conf: cur.conf, naturalness: cur.nat,
            rt_ms: Date.now() - cur.t_play});
  nextTrial();
};

function finish() {
  document.getElementById("trial").style.display = "none";
  const R = document.getElementById("result");
  R.style.display = "block";
  // 正答率表: 行=変形、列=ゲート(全長除く)。全長は自然さ平均
  let html = "<div class='qtitle'>結果（正答率）</div><table><tr><th>変形</th>";
  M.gate_labels.slice(0, -1).forEach(l => html += `<th>${l}</th>`);
  html += "<th>自然さ(全長)</th></tr>";
  for (const v of M.variants) {
    html += `<tr><td>${v.target === "vowel" ? "母音" : "子音"}×${v.scale}</td>`;
    for (let gi = 0; gi < M.gate_labels.length - 1; gi++) {
      const rows = rec.filter(r => r.variant === v.id && r.gate_idx === gi);
      const acc = rows.length ? Math.round(100 * rows.reduce((a, r) => a + r.correct, 0) / rows.length) : "-";
      html += `<td>${acc}${rows.length ? "%" : ""}</td>`;
    }
    const nats = rec.filter(r => r.variant === v.id && r.naturalness != null);
    const nm = nats.length ? (nats.reduce((a, r) => a + r.naturalness, 0) / nats.length).toFixed(1) : "-";
    html += `<td>${nm}</td></tr>`;
  }
  html += "</table><div style='margin-top:18px'><button class='primary' id='csv'>CSVを保存</button></div>";
  R.innerHTML = html;
  document.getElementById("csv").onclick = () => {
    const head = Object.keys(rec[0]).join(",");
    const rows = rec.map(r => Object.values(r).join(","));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([head + "\n" + rows.join("\n")], {type: "text/csv"}));
    a.download = "segment_pilot.csv";
    a.click();
  };
}
</script>
</body>
</html>
